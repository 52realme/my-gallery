<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MYGALLERY</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:system-ui,sans-serif}
:root{
  --bg:#0c0c14;
  --card:rgba(20,20,35,0.65);
  --text:#f0f0f8;
  --text-dim:#aaaacc;
  --accent:#ffb347;
  --blur:12px;
}
body{
  min-height:100vh;
  color:var(--text);
  /* 仅替换背景图片链接，其余全部原样保留 */
  background: var(--bg) url("https://s2.loli.net/2025/09/25/3q7dYg9XJfZcRkP.png") center/cover no-repeat fixed;
  padding:20px;
}
.overlay{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,0.55);
  z-index:-1;
}
header{display:flex;justify-content:space-between;align-items:center;margin-bottom:32px}
.logo{font-size:32px;font-weight:700}
.logo span{color:var(--accent)}
.top-right{display:flex;gap:16px;align-items:center}
.btn-outline{border:1px solid var(--accent);color:var(--accent);background:rgba(0,0,0,0.3);padding:10px 22px;border-radius:99px;font-size:16px;backdrop-filter:blur(var(--blur))}
.menu-icon{font-size:28px}
.page-title{margin-bottom:24px}
.page-title h2{font-size:36px;margin-bottom:10px}
.page-title p{color:var(--text-dim);font-size:16px;line-height:1.6}
/* 输入卡片 毛玻璃 */
.input-card{
  background:var(--card);
  backdrop-filter:blur(var(--blur));
  border-radius:20px;
  padding:28px;
  margin-bottom:24px;
  border:1px solid rgba(255,255,255,0.08);
}
.input-card input{
  width:100%;
  background:rgba(255,255,255,0.08);
  border:none;color:#fff;padding:16px;border-radius:14px;font-size:16px;margin-bottom:18px;
}
.primary-btn{
  width:100%;background:var(--accent);color:#000;border:none;padding:16px;border-radius:14px;font-weight:bold;font-size:17px;box-shadow:0 4px 16px rgba(255,179,71,0.25);
}
.tips-text{text-align:center;color:var(--text-dim);margin-top:16px}
/* 播放列表 */
.playlist-item{
  background:var(--card);backdrop-filter:blur(var(--blur));border:1px solid rgba(255,255,255,0.08);
  display:flex;align-items:center;gap:14px;padding:16px;border-radius:16px;margin-bottom:12px;
}
.play-btn{width:50px;height:50px;border-radius:50%;background:var(--accent);border:none;font-size:20px;flex-shrink:0}
.item-info{flex:1}
.item-title{font-size:17px;margin-bottom:4px}
.item-platform{color:var(--text-dim);font-size:14px}
/* 可视化区域 */
.visualizer{margin-top:30px}
#vizCanvas{width:100%;height:240px;border-radius:16px;background:rgba(0,0,0,0.4)}
.viz-status{margin-top:10px;color:var(--text-dim)}
/* 弹窗播放器 */
.player-modal{position:fixed;inset:0;background:rgba(0,0,0,0.88);display:none;align-items:center;justify-content:center;padding:20px;z-index:99}
.player-modal.open{display:flex}
.modal-inner{width:100%;max-width:620px;background:#101020;border-radius:18px;padding:24px}
.modal-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}
#playerClose{background:none;border:none;color:#fff;font-size:28px}
#playerFrameWrap{min-height:100px;margin:12px 0}
/* 提示弹窗 */
.toast{position:fixed;top:20px;left:50%;transform:translateX(-50%);padding:12px 20px;border-radius:12px;color:#fff;z-index:100;backdrop-filter:blur(10px)}
.toast.err{background:rgba(220,40,40,0.7)}
.toast.ok{background:rgba(40,180,80,0.7)}
</style>
</head>
<body>
<div class="overlay"></div>
<header>
  <div class="logo">MY<span>GALLERY</span></div>
  <div class="top-right">
    <button class="btn-outline">登录</button>
    <div class="menu-icon">☰</div>
  </div>
</header>

<div class="page-title">
  <h2>多平台音乐</h2>
  <p>直接粘贴完整分享链接，自动识别，网易云、QQ音乐、Bilibili，网页内直接播放</p>
</div>

<div class="input-card">
  <input id="linkInput" placeholder="粘贴网易云 / QQ音乐 / B站完整分享链接">
  <button class="primary-btn" id="addBtn">添加到播放列表</button>
  <div class="tips-text">播放列表为空，粘贴上方链接添加歌曲吧</div>
</div>

<div id="playlistBox"></div>

<div class="visualizer">
  <p style="margin-bottom:12px;color:var(--text-dim)">VISUALIZER</p>
  <canvas id="vizCanvas"></canvas>
  <div class="viz-status" id="vizStatus">等待播放</div>
  <div id="vizSongName" style="margin-top:6px;font-size:18px"></div>
</div>

<div class="player-modal" id="playerModal">
  <div class="modal-inner">
    <div class="modal-head">
      <h3 id="playerTitle"></h3>
      <button id="playerClose">×</button>
    </div>
    <div id="playerFrameWrap"></div>
  </div>
</div>

<div id="toastBox"></div>

<script>
const $ = s => document.querySelector(s);
const $$ = s => document.querySelectorAll(s);

let playlist = [];
let vizMode = "stop";
const canvas = $('#vizCanvas');
const ctx = canvas.getContext('2d');

// 画布自适应
function resizeCanvas(){
  canvas.width = canvas.clientWidth;
  canvas.height = canvas.clientHeight;
}
window.addEventListener('resize',resizeCanvas);
resizeCanvas();

// 音频可视化渲染
function drawViz(){
  if(vizMode === "stop"){
    ctx.clearRect(0,0,canvas.width,canvas.height);
    return;
  }
  requestAnimationFrame(drawViz);
  ctx.clearRect(0,0,canvas.width,canvas.height);
  const barCount = 72;
  const barW = canvas.width / barCount;
  ctx.fillStyle="#ffb347";
  for(let i=0;i<barCount;i++){
    const h = vizMode==='simulate' ? Math.random()*canvas.height*0.7 : 0;
    ctx.fillRect(i*barW, canvas.height - h, barW-2, h);
  }
}

// 弹出提示
function showToast(msg,type="err"){
  const t = document.createElement('div');
  t.className = `toast ${type}`;
  t.textContent = msg;
  $('#toastBox').appendChild(t);
  setTimeout(()=>t.remove(),2200);
}

// 自动识别平台
function detectPlatform(url){
  if(url.includes("music.163.com")) return "netease";
  if(url.includes("y.qq.com")) return "qq";
  if(url.includes("bilibili.com") || url.includes("b23.tv")) return "bilibili";
  return null;
}

// 【重点】直接使用完整链接，网易云单独处理为内嵌播放器
function getEmbedUrl(platform, rawUrl){
  if (platform === "netease") {
    const idMatch = rawUrl.match(/id=(\d+)/);
    if(idMatch){
      return `https://music.163.com/outchain/player?type=2&id=${idMatch[1]}&auto=1&height=66`;
    }
  }
  // QQ音乐 / B站 直接使用你粘贴的完整原链接
  return rawUrl;
}

// 添加歌曲
$("#addBtn").onclick = function(){
  const input = $("#linkInput");
  const rawLink = input.value.trim();
  if(!rawLink) return showToast("请粘贴链接");
  const platform = detectPlatform(rawLink);
  if(!platform) return showToast("无法识别该链接，请检查格式");
  const embedUrl = getEmbedUrl(platform, rawLink);
  const nameMap = {netease:"网易云音乐",qq:"QQ音乐",bilibili:"Bilibili"};
  const title = `${nameMap[platform]} 歌曲 #${playlist.length+1}`;
  playlist.push({platform,title,url:embedUrl,raw:rawLink});
  renderPlaylist();
  input.value = "";
  showToast("添加成功！","ok");
}

// 渲染歌单
function renderPlaylist(){
  const box = $("#playlistBox");
  box.innerHTML = '';
  playlist.forEach((item,idx)=>{
    const div = document.createElement('div');
    div.className = "playlist-item";
    div.innerHTML = `
      <button class="play-btn">▶</button>
      <div class="item-info">
        <div class="item-title">${item.title}</div>
        <div class="item-platform">${item.platform}</div>
      </div>
    `;
    div.querySelector('.play-btn').onclick = ()=>playMusic(item);
    box.appendChild(div);
  })
}

// 播放
function playMusic(item){
  $("#playerTitle").textContent = item.title;
  const wrap = $("#playerFrameWrap");
  let iframeHeight = item.platform==='bilibili' ? 400 : 86;
  wrap.innerHTML = `<iframe src="${item.url}" height="${iframeHeight}" allow="autoplay; fullscreen" loading="lazy" style="width:100%;border:0;border-radius:10px"></iframe>`;
  $("#playerModal").classList.add('open');
  vizMode = 'simulate';
  $("#vizStatus").textContent = "音乐播放中...";
  $("#vizSongName").textContent = item.title;
  drawViz();
}

// 关闭播放器
$("#playerClose").onclick = function(){
  $("#playerModal").classList.remove('open');
  $("#playerFrameWrap").innerHTML = '';
  vizMode = 'stop';
  $("#vizStatus").textContent = "已停止";
  $("#vizSongName").textContent = "";
}
</script>
</body>
</html>
