<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>我的图片空间 · Gallery Pro</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:system-ui,sans-serif}
:root{--bg:#0c0c14;--card:#161627;--text:#f0f0f8;--text-dim:#aaaacc;--accent:#ffb347}
body{background:var(--bg);color:var(--text);min-height:100vh;padding:16px}
header{display:flex;justify-content:space-between;align-items:center;margin-bottom:24px}
.logo{font-size:28px;font-weight:bold}
.btn{border:1px solid var(--accent);color:var(--accent);background:transparent;padding:10px 20px;border-radius:99px;font-size:16px}
.tabs{display:flex;gap:10px;margin-bottom:16px}
.tab-btn{padding:10px 18px;border-radius:99px;border:none;background:#1f1f36;color:#fff;font-size:16px}
.tab-btn.active{background:var(--accent);color:#000}
.input-wrap{background:var(--card);border-radius:14px;padding:20px;margin-bottom:16px}
input{width:100%;background:#22223b;border:none;color:#fff;padding:14px;border-radius:10px;font-size:16px;margin-bottom:14px}
.primary-btn{width:100%;background:var(--accent);color:#000;border:none;padding:14px;border-radius:10px;font-weight:bold;font-size:16px}
.playlist-item{display:flex;align-items:center;gap:12px;background:var(--card);padding:14px;border-radius:12px;margin-bottom:10px}
.play-btn{width:48px;height:48px;border-radius:50%;background:var(--accent);border:none;font-size:20px}
.visualizer{margin-top:30px}
#vizCanvas{width:100%;height:220px;background:#05050a;border-radius:14px}
.player-modal{position:fixed;inset:0;background:rgba(0,0,0,0.85);display:none;align-items:center;justify-content:center;padding:20px}
.player-modal.open{display:flex}
.modal-inner{width:100%;max-width:600px;background:#101020;border-radius:16px;padding:20px}
#playerFrameWrap{min-height:100px;margin:12px 0}
</style>
</head>
<body>
<header>
<div class="logo">MY<span>GALLERY</span></div>
<button class="btn">登录</button>
</header>

<div class="tabs">
<button class="tab-btn active" data-platform="netease">网易云音乐</button>
<button class="tab-btn" data-platform="qq">QQ音乐</button>
<button class="tab-btn" data-platform="bilibili">Bilibili</button>
</div>

<div class="input-wrap" data-platform="netease">
<input placeholder="粘贴网易云音乐分享链接">
<button class="primary-btn">添加到播放列表</button>
</div>
<div class="input-wrap" data-platform="qq" style="display:none">
<input placeholder="粘贴QQ音乐分享链接">
<button class="primary-btn">添加到播放列表</button>
</div>
<div class="input-wrap" data-platform="bilibili" style="display:none">
<input placeholder="粘贴B站视频链接/BV号">
<button class="primary-btn">添加到播放列表</button>
</div>

<div id="playlist"></div>

<div class="visualizer">
<p style="margin-bottom:10px;color:var(--text-dim)">VISUALIZER</p>
<canvas id="vizCanvas"></canvas>
<div style="margin-top:8px;color:var(--text-dim)" id="vizStatus">等待播放</div>
<div id="vizSongName"></div>
</div>

<div class="player-modal" id="playerModal">
<div class="modal-inner">
<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px">
<h3 id="playerTitle"></h3>
<button id="playerClose" style="background:none;border:none;color:#fff;font-size:24px">×</button>
</div>
<div id="playerFrameWrap"></div>
</div>
</div>

<script>
const $ = s => document.querySelector(s);
const $$ = s => document.querySelectorAll(s);

// ========== 平台配置（仅保留网易云 QQ B站） ==========
const platformConfig = {
  netease:{name:"网易云音乐"},
  qq:{name:"QQ音乐"},
  bilibili:{name:"Bilibili"}
};
let currentPlatform = "netease";
let playlist = [];

// 标签切换
$$(".tab-btn").forEach(btn=>{
  btn.onclick = ()=>{
    $$(".tab-btn").forEach(b=>b.classList.remove('active'));
    btn.classList.add('active');
    currentPlatform = btn.dataset.platform;
    $$(".input-wrap").forEach(w=>w.style.display="none");
    $(`.input-wrap[data-platform="${currentPlatform}"]`).style.display="block";
  }
})

// ========== 音频可视化 ==========
const canvas = $('#vizCanvas');
const ctx = canvas.getContext('2d');
let vizMode = "stop";
let vizSongName = $("#vizSongName");
let vizStatus = $("#vizStatus");
let simTimer;
function resizeCanvas(){
  canvas.width = canvas.clientWidth;
  canvas.height = canvas.clientHeight;
}
window.addEventListener('resize',resizeCanvas);
resizeCanvas();

function drawViz(){
  if(vizMode === "stop"){
    ctx.clearRect(0,0,canvas.width,canvas.height);
    return;
  }
  requestAnimationFrame(drawViz);
  ctx.clearRect(0,0,canvas.width,canvas.height);
  const barCount = 64;
  const barW = canvas.width / barCount;
  ctx.fillStyle="#ffb347";
  for(let i=0;i<barCount;i++){
    const h = vizMode==='simulate' ? Math.random()*canvas.height*0.7 : 0;
    ctx.fillRect(i*barW, canvas.height - h, barW-2, h);
  }
}

// ========== 播放歌曲（内嵌iframe，可视化联动） ==========
function playMusic(item){
  const wrap = $("#playerFrameWrap");
  $("#playerTitle").textContent = item.title;
  let height = item.platform==='netease' ? 86 : item.platform==='bilibili' ? 400 : 86;
  wrap.innerHTML = `<iframe src="${item.url}" height="${height}" allow="autoplay; fullscreen" loading="lazy"></iframe>`;
  $("#playerModal").classList.add('open');
  // 启动可视化
  vizMode = 'simulate';
  vizStatus.textContent = "音乐播放中...";
  vizSongName.textContent = item.title;
  drawViz();
}

$("#playerClose").onclick = function(){
  $("#playerModal").classList.remove('open');
  $("#playerFrameWrap").innerHTML = '';
  vizMode = 'stop';
  vizStatus.textContent = "已停止";
  vizSongName.textContent = "";
}

// 渲染歌单
function renderPlaylist(){
  const pl = $("#playlist");
  pl.innerHTML = '';
  playlist.forEach((item,idx)=>{
    const div = document.createElement('div');
    div.className = "playlist-item";
    div.innerHTML = `
      <button class="play-btn">▶</button>
      <div>
        <div>${item.title}</div>
        <small style="color:var(--text-dim)">${platformConfig[item.platform].name}</small>
      </div>
    `;
    div.querySelector('.play-btn').onclick = ()=>playMusic(item);
    pl.appendChild(div);
  })
}

// 添加歌曲逻辑
$$(".primary-btn").forEach(btn=>{
  btn.onclick = function(){
    const wrap = this.closest('.input-wrap');
    const input = wrap.querySelector('input');
    const link = input.value.trim();
    if(!link) return alert("请粘贴链接");
    playlist.push({
      platform:currentPlatform,
      title:currentPlatform+"歌曲 "+(playlist.length+1),
      url:link
    })
    renderPlaylist();
    input.value = "";
  }
})
</script>
</body>
</html>
