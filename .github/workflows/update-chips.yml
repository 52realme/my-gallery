name: 自动更新芯片数据

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: 获取网站代码
        uses: actions/checkout@v4

      - name: 设置 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: 自动检测官方芯片资料
        run: |
          python - <<'PY'
          from pathlib import Path
          from datetime import datetime, timezone
          import urllib.request
          import re
          import json

          file = Path("chips.html")
          text = file.read_text(encoding="utf-8")

          sources = [
              {
                  "brand": "Qualcomm",
                  "url": "https://www.qualcomm.com/news/releases"
              },
              {
                  "brand": "MediaTek",
                  "url": "https://www.mediatek.com/news-events/press-releases"
              },
              {
                  "brand": "Apple",
                  "url": "https://www.apple.com/newsroom/"
              }
          ]

          found = []

          for source in sources:
              try:
                  request = urllib.request.Request(
                      source["url"],
                      headers={
                          "User-Agent": "Mozilla/5.0"
                      }
                  )

                  with urllib.request.urlopen(
                      request,
                      timeout=30
                  ) as response:

                      html = response.read().decode(
                          "utf-8",
                          errors="ignore"
                      )

                  if source["brand"] == "Qualcomm":
                      patterns = [
                          r"Snapdragon\s+[A-Za-z0-9][A-Za-z0-9 .-]{2,60}"
                      ]

                  elif source["brand"] == "MediaTek":
                      patterns = [
                          r"Dimensity\s+[A-Za-z0-9][A-Za-z0-9 .-]{2,60}"
                      ]

                  else:
                      patterns = [
                          r"\bA\d{1,2}\s*(?:Pro|Max|Ultra)?\b"
                      ]

                  names = []

                  for pattern in patterns:
                      names += re.findall(
                          pattern,
                          html,
                          flags=re.IGNORECASE
                      )

                  for name in names:
                      name = re.sub(
                          r"\s+",
                          " ",
                          name
                      ).strip()

                      if name not in names:
                          continue

                      if len(name) > 70:
                          continue

                      if name not in [
                          item["name"]
                          for item in found
                      ]:
                          found.append({
                              "name": name,
                              "brand": source["brand"],
                              "year": str(datetime.now().year),
                              "process": "待官方确认",
                              "cpu": "待官方确认",
                              "gpu": "待官方确认",
                              "ai": "待官方确认",
                              "source": source["url"]
                          })

                  print(
                      source["brand"],
                      "检测完成"
                  )

              except Exception as error:
                  print(
                      source["brand"],
                      "检测失败：",
                      error
                  )

          print(
              "本次共发现",
              len(found),
              "条官方芯片相关名称"
          )

          now = datetime.now(
              timezone.utc
          ).strftime(
              "%Y-%m-%d %H:%M UTC"
          )

          text = re.sub(
              r'资料更新时间：\s*<span id="time"></span>',
              f'资料更新时间：<span id="time"></span>',
              text
          )

          marker = "自动检测时间："

          if marker in text:
              text = re.sub(
                  r'自动检测时间：[^<]*',
                  f'自动检测时间：{now}',
                  text
              )

          file.write_text(
              text,
              encoding="utf-8"
          )

          Path("detected-chips.json").write_text(
              json.dumps(
                  found,
                  ensure_ascii=False,
                  indent=2
              ),
              encoding="utf-8"
          )

          PY

      - name: 保存检测结果
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add chips.html detected-chips.json

          git diff --cached --quiet || \
            git commit -m "自动更新芯片检测结果"

          git push
