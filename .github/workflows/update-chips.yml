name: 自动更新芯片数据

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: 获取网站代码
        uses: actions/checkout@v4

      - name: 设置 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: 自动发现官方芯片
        run: |
          python - <<'PY'
          from pathlib import Path
          from datetime import datetime, timezone
          import urllib.request
          import re
          import json

          sources = [
              {
                  "brand": "Qualcomm",
                  "url": "https://www.qualcomm.com/news/releases"
              },
              {
                  "brand": "MediaTek",
                  "url": "https://www.mediatek.com/press-room/archive/2026"
              },
              {
                  "brand": "Apple",
                  "url": "https://www.apple.com/newsroom/archive/"
              }
          ]

          found = []

          patterns = {
              "Qualcomm": r"Snapdragon\s+[A-Za-z0-9][A-Za-z0-9 .-]{2,60}",
              "MediaTek": r"Dimensity\s+[A-Za-z0-9][A-Za-z0-9 .-]{2,60}",
              "Apple": r"\bA\d{2}(?:\s+Pro)?\b"
          }

          for source in sources:
              try:
                  req = urllib.request.Request(
                      source["url"],
                      headers={"User-Agent": "Mozilla/5.0"}
                  )

                  with urllib.request.urlopen(
                      req,
                      timeout=30
                  ) as response:
                      html = response.read(
                          500000
                      ).decode(
                          "utf-8",
                          errors="ignore"
                      )

                  names = re.findall(
                      patterns[source["brand"]],
                      html,
                      flags=re.IGNORECASE
                  )

                  cleaned = []

                  for name in names:
                      name = re.sub(
                          r"\s+",
                          " ",
                          name
                      ).strip()

                      if name not in cleaned:
                          cleaned.append(name)

                  for name in cleaned:
                      found.append({
                          "name": name,
                          "brand": source["brand"],
                          "source": source["url"]
                      })

                  print(
                      source["brand"],
                      "检查成功，发现",
                      len(cleaned),
                      "个名称"
                  )

              except Exception as e:
                  print(
                      source["brand"],
                      "检查失败:",
                      e
                  )

          now = datetime.now(
              timezone.utc
          ).strftime(
              "%Y-%m-%d %H:%M UTC"
          )

          output = {
              "updated": now,
              "items": found
          }

          Path(
              "chip-updates.json"
          ).write_text(
              json.dumps(
                  output,
                  ensure_ascii=False,
                  indent=2
              ),
              encoding="utf-8"
          )

          print(
              "共发现",
              len(found),
              "条官方芯片资料"
          )
          print(
              "更新时间:",
              now
          )
          PY

      - name: 保存自动发现结果
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add chip-updates.json

          git diff --cached --quiet || \
          git commit -m "自动更新官方芯片资料"

          git push
