name: 自动更新芯片数据

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: 获取网站代码
        uses: actions/checkout@v4

      - name: 设置 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

                - name: 自动获取官方芯片资料
        run: |
          python - <<'PY'
          from pathlib import Path
          from datetime import datetime, timezone
          import urllib.request
          import re
          import json

          file = Path("chips.html")
          text = file.read_text(encoding="utf-8")

          sources = [
              ("Qualcomm", "Qualcomm 官方",
               "https://www.qualcomm.com/news/releases"),
              ("MediaTek", "MediaTek 官方",
               "https://www.mediatek.com/news-events/press-releases"),
              ("Apple", "Apple 官方",
               "https://www.apple.com/newsroom/")
          ]

          found = []

          for brand, source, url in sources:
              try:
                  req = urllib.request.Request(
                      url,
                      headers={"User-Agent": "Mozilla/5.0"}
                  )

                  with urllib.request.urlopen(req, timeout=30) as r:
                      html = r.read().decode("utf-8", errors="ignore")

                  if brand == "Qualcomm":
                      names = re.findall(
                          r"Snapdragon\s+[A-Za-z0-9]+(?:\s+[A-Za-z0-9-]+){0,6}",
                          html
                      )

                  elif brand == "MediaTek":
                      names = re.findall(
                          r"Dimensity\s+[0-9A-Za-z]+(?:\s+[A-Za-z0-9-]+){0,4}",
                          html
                      )

                  else:
                      names = re.findall(
                          r"\bA[0-9]{2}(?:\s+Pro)?\b",
                          html
                      )

                  for name in names:
                      name = " ".join(name.split())

                      if name not in [x["name"] for x in found]:
                          found.append({
                              "name": name,
                              "brand": brand,
                              "year": str(datetime.now().year),
                              "process": "待官方确认",
                              "cpu": "待官方确认",
                              "gpu": "待官方确认",
                              "ai": "待官方确认",
                              "source": source
                          })

              except Exception as e:
                  print("获取失败:", brand, e)

          print("发现:", found)

          start = text.find("const chips = [")
          end = text.find("];", start)

          if start == -1 or end == -1:
              raise SystemExit("找不到 chips 数据区域")

          old_data = text[start:end + 2]

          existing_names = set(
              re.findall(r'name:"([^"]+)"', old_data)
          )

          new_items = [
              item for item in found
              if item["name"] not in existing_names
          ]

          if new_items:
              insert = ",\n" + ",\n".join(
                  "  " + json.dumps(item, ensure_ascii=False)
                  for item in new_items
              )

              new_data = old_data[:-2] + insert + "\n];"
              text = text[:start] + new_data + text[end + 2:]

          now = datetime.now(timezone.utc).strftime(
              "%Y-%m-%d %H:%M UTC"
          )

          text = re.sub(
              r"自动检测时间：.*?<br>",
              f"自动检测时间：{now}<br>",
              text,
              count=1
          )

          file.write_text(text, encoding="utf-8")

          print("新增芯片:", len(new_items))
          print("自动检测时间:", now)
          PY 
      - name: 保存更新
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add chips.html
          git diff --cached --quiet || git commit -m "自动更新芯片检测时间"
          git push
